[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferoom"
version = "1.0.0"
description = "Privacy-preserving indoor fall detection with a 60 GHz mmWave radar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Guillermo Sánchez" }]
keywords = ["mmwave", "radar", "fall-detection", "elderly-care", "iwr6843", "edge-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["pyqtgraph>=0.13", "PyQt5>=5.15", "PyOpenGL>=3.1"]
ml = ["xgboost>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "matplotlib>=3.7"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "httpx>=0.27"]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Siidebox/SafeRoom"
Documentation = "https://github.com/Siidebox/SafeRoom/tree/main/docs"

[project.scripts]
saferoom-read      = "saferoom.radar.reader:main"
saferoom-config    = "saferoom.radar.config:main"
saferoom-record    = "saferoom.dataset.recorder:main"
saferoom-label     = "saferoom.dataset.labeling:main"
saferoom-label-mm  = "saferoom.dataset.labeling_multimodal:main"
saferoom-check-sync = "saferoom.dataset.check_sync:main"
saferoom-synth     = "saferoom.dataset.synth:main"
saferoom-features  = "saferoom.ml.features:main"
saferoom-train     = "saferoom.ml.train:main"
saferoom-evaluate  = "saferoom.ml.evaluate:main"
saferoom-replay    = "saferoom.evaluation.replay:main"
saferoom-analyze   = "saferoom.evaluation.analyze:main"
saferoom-dashboard = "saferoom.dashboard.server:main"
saferoom-ir-record = "saferoom.ir.recorder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saferoom = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741", "B008"]
