name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The `viz` extra pulls in PyQt5/OpenGL, which need a display. The
      # visualizer is imported lazily, so it is not needed to run the suite.
      - name: Install
        run: pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
